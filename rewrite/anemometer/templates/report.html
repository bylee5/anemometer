<script>
	$(function() {
		dbFields = {{ (table_fields|flatten|php_json) }};
		$("#dimension-ts_min_start").datetimepicker({ dateFormat: 'yy-mm-dd', timeFormat: 'hh:mm:ss' });
		$("#dimension-ts_min_end").datetimepicker({ dateFormat: 'yy-mm-dd', timeFormat: 'hh:mm:ss' });
		$("#fact-first_seen").datetimepicker({ dateFormat: 'yy-mm-dd', timeFormat: 'hh:mm:ss' });
		$(".typeahead").typeahead({ source: dbFields, items: 8});
		$('.combobox').combobox();
		prettyPrint();
	});
</script>

<div class="row">
	<form action="{{ site_url ~ '?action=report' }}" method="GET" class="form-inline">
	<input type="hidden" name="action" value="report">
	<input type="hidden" name="datasource" value="{{ datasource }}">
	<div class="row">
		<div class="span3">
			From<br>
			<div class="input-append">
				<input type="text" class="span2" name="dimension-{{ time_field_name }}_start" id="dimension-ts_min_start" value="{{ get_var('dimension-' ~ time_field_name ~ '_start') }}">
				<span class="add-on"><i class="icon-calendar" id="dp"></i></span>
			</div>
		</div>
		
    

		<div class="span4">
			To<br>
			<div class="input-append">
				<input type="text" class="span2" name="dimension-{{ time_field_name }}_end" id="dimension-ts_min_end" value="{{ get_var('dimension-' ~ time_field_name ~ '_end') }}">
				<span class="add-on"><i class="icon-calendar" id="dp"></i></span>
			</div>
		</div>

	<div class="span4">
		Query first seen since<br>
		<div class="input-append">
			<input type="text" class="span2" name="fact-first_seen" id="fact-first_seen" value="{{ get_var('fact-first_seen') }}">
			<span class="add-on"><i class="icon-calendar" id="dp"></i></span>
		</div>
	</div>
</div>
	<hr>
<div class="row">
	<div class="span3">
			Table Fields<br>
		<select name="table_fields[]" class="span3" size="20" multiple="true">
			<optgroup label="Custom Fields">
			{% for f in custom_fields or [] %}
				<option value="{{ f }}" {% if (table_fields_selected is defined and table_fields_selected is not none) and (f in (table_fields_selected or [])) %}SELECTED{% endif %}>{{ f }}</option>
			{% endfor %}
			</optgroup>
			
			{% for table in table_fields or [] %}
				<optgroup label="{{ table }}">
					{% for f in table_fields[table] or [] %}
						{% set field_name = table_aliases[table] ~ '.' ~ f %}
						{% set is_selected = false %}
						{% set is_selected = (table_fields_selected is defined and table_fields_selected is not none and field_name in (table_fields_selected or [])) or (f not in (exception_select_fields or []) and f in (table_fields_selected or [])) %}
						<option value="{{ field_name }}" {% if is_selected %}SELECTED{% endif %}>{{ f }}</option>
					{% endfor %}
				</optgroup>
			{% endfor %}
		</select>
	</div>
	
	<div class="span4">
		Filter By Host<br>
		<select name="dimension-{{ hostname_field_name }}" class="span3 combobox">
			<option value=""></option>
			{% for h in hosts or [] %}
				<option value="{{ h }}" {% if get_var('dimension-' ~ hostname_field_name) is php_eq(h) %}SELECTED{% endif %}>{{ h }}</option>
			{% endfor %}
		</select><br>
		
		Group By<br>
		<input name="fact-group" class="span4 typeahead" value="{{ get_var('fact-group') }}" data-provide="typeahead"><br><br>
		Order By<br>
		<input name="fact-order" class="span4 typeahead" value="{{ get_var('fact-order') }}"><br><br>
		Having<br>
		<input name="fact-having" class="span4 typeahead" value="{{ get_var('fact-having') }}"><br><br>
		Limit<br>
		<input name="fact-limit" class="span1" value="{{ get_var('fact-limit') }}"><br><br>
		<center>
			<input type="submit" class="btn-primary btn-large" name="submit" value="Search">
		</center>
		
	</div>
	
	<div class="span4">
		<!--
		Extra Fields<br>
		<textarea name="extra_fields" class="span4" rows="6">{{ get_var('extra_fields') }}</textarea><br><br>
		-->
		
		Where<br>
		<textarea name="fact-where" class="span4" rows="6">{{ get_var('fact-where') }}</textarea><br><br>
		Query Sample Contains<br>
		<input name="fact-{{ sample_field_name }}" class="span4" value="{{ get_var('fact-' ~ sample_field_name) }}"><br><br>
		Reviewed Status<br>
		<select class="span4 combobox" name="fact-reviewed_status">
			<option value=""></option>
		{% for rt in review_types or [] %}
				<option value="{{ rt }}" {% if get_var('fact-reviewed_status') is php_eq(rt) %} SELECTED {% endif %}>{{ rt }}</option>
		{% endfor %}
		</select><br>
		
		Checksum<br>
		<input name="fact-{{ checksum_field_name }}" class="span4 typeahead" value="{{ get_var('fact-' ~ checksum_field_name) }}"><br><br>
		
	</div>
	
</div>
<hr>
